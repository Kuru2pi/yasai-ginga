<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>似顔絵 印刷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--fg:#111;--muted:#888;--line:#e4e4e4;--bg:#fff;--soft:#f5f5f5;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:minmax(260px,320px) 1fr;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (max-width:820px) and (orientation:portrait){.app{grid-template-columns:1fr;grid-template-rows:38dvh 1fr}}

/* list of entries */
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.side header{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.side h1{font-size:18px;margin:0;flex:1}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
.pill.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.filters{display:flex;gap:6px;padding:0 16px 10px}
.list{flex:1;overflow:auto;padding:0 10px 16px;-webkit-overflow-scrolling:touch}
.entry{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:12px}
.entry.sel{background:var(--soft)}
.entry b{font-family:"DotGothic16",monospace;font-size:22px;font-weight:400;min-width:2.6em}
.entry .who{min-width:0}
.entry .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .who small{color:var(--muted);font-size:12px}
.chip{font-size:11px;border-radius:999px;padding:3px 8px;background:var(--soft);color:#555;white-space:nowrap}
.chip.完成,.chip.受け渡し済{background:#e7f6ea;color:#1b7a35}
.msg{color:var(--muted);font-size:13px;padding:12px 16px;line-height:1.6}

/* editor */
.main{display:flex;flex-direction:column;min-height:0;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px 8px}
.veg{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px}
.veg i{width:10px;height:10px;border-radius:50%}
.veg.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);font-weight:700}
.fields{display:flex;gap:10px;align-items:center;padding:4px 18px 10px;flex-wrap:wrap}
.fields label{font-size:13px;color:var(--muted)}
.fields input[type=text]{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:14em}
.stage{flex:1;display:flex;gap:18px;align-items:flex-start;justify-content:center;padding:6px 18px 18px;min-height:0}
.front{position:relative;touch-action:none}
.front canvas{display:block;height:min(62dvh,560px);width:auto;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.drop{position:absolute;inset:0;border:3px dashed var(--fg);border-radius:10px;background:rgba(255,255,255,.6);display:grid;place-items:center;font-weight:700}
.backcol{display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.backcol img{height:min(26dvh,230px);border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.tools{display:flex;flex-direction:column;gap:10px;width:220px}
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-weight:600}
.btn.primary{background:var(--fg);color:#fff;border-color:var(--fg);font-size:18px;padding:18px}
.btn:disabled{opacity:.35}
.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:0}
.zoom{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.zoom input{flex:1}
.bgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bgs button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);padding:0}
.bgs button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--fg)}
.bgs input{width:32px;height:30px;border:0;padding:0;background:none}
.inbox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.inbox button{position:relative;border:1px solid var(--line);border-radius:8px;padding:0;background:var(--soft);aspect-ratio:3/2;overflow:hidden}
.inbox img{width:100%;height:100%;object-fit:cover;display:block}
.inbox small{position:absolute;right:3px;bottom:2px;font-size:10px;background:rgba(255,255,255,.85);border-radius:4px;padding:0 3px}
.inbox button.used{opacity:.35}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));translate:-50% 0;background:var(--fg);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:#fff;color:var(--fg);border:0;border-radius:10px;padding:8px 12px;font-weight:700}
.toast button.x{background:none;color:#fff;font-weight:400}
.keybox{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.keybox form{background:#fff;border-radius:18px;padding:22px;width:min(90vw,360px);display:flex;flex-direction:column;gap:12px}
.keybox input{font:inherit;font-size:17px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* print: one 2L sheet (127×178 mm) with front and back stacked; folded in the middle, printed side out */
#print{display:none}
@page{size:127mm 178mm;margin:0}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:flex;width:127mm;height:178mm;align-items:center;justify-content:center;overflow:hidden}
  #pSheet{width:calc(127mm * var(--k,1));height:calc(178mm * var(--k,1))}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <header>
      <h1>似顔絵 印刷</h1>
      <button class="pill" id="reload">更新</button>
    </header>
    <div class="filters">
      <button class="pill on" data-f="todo">未完成</button>
      <button class="pill" data-f="all">すべて</button>
      <button class="pill" id="manual">＋ 手入力</button>
    </div>
    <div class="msg" id="listMsg">読み込み中…</div>
    <div class="list" id="list"></div>
  </aside>

  <main class="main">
    <div class="bar" id="vegs"></div>
    <div class="fields">
      <label for="nick">ニックネーム</label><input type="text" id="nick" autocomplete="off">
      <span class="chip" id="who" hidden></span>
    </div>
    <div class="stage">
      <div class="front" id="front">
        <canvas id="cv" width="1219" height="1700"></canvas>
        <div class="drop" id="drop" hidden>ここにドロップ</div>
      </div>
      <div class="tools">
        <div id="inboxBox" hidden><div class="zoom"><span>届いた絵（AirDrop）</span></div><div class="inbox" id="inbox"></div></div>
        <button class="btn" id="pick">似顔絵を選ぶ</button>
        <input type="file" id="file" accept="image/*" hidden>
        <div class="zoom"><span>大きさ</span><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></div>
        <button class="btn" id="fit">位置をリセット</button>
        <div class="zoom"><span>背景色</span></div>
        <div class="bgs" id="bgs"><input type="color" id="bgPick" aria-label="好きな色"></div>
        <p class="hint">絵は指でドラッグして動かし、2本指で拡大・縮小できます。Procreate からドラッグして入れることもできます。</p>
        <div class="backcol"><img id="backImg" alt="">裏（同じ紙の下半分に印刷）</div>
        <div class="zoom"><span>倍率補正</span><input type="number" id="scale" min="90" max="110" step="0.1" value="100" style="width:5.5em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px">%</div>
        <button class="btn primary" id="printBtn" disabled>印刷</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastDo" hidden>完成にする</button><button class="x" id="toastX">とじる</button></div>
<div class="keybox" id="keybox" hidden>
  <form id="keyForm">
    <b>合言葉を入れてください</b>
    <input type="password" id="keyIn" autocomplete="off" autocapitalize="off">
    <button class="btn primary" type="submit">OK</button>
  </form>
</div>
<div id="print"><img id="pSheet" alt=""></div>

<script type="module">
/* ---------- settings ---------- */
const SERVER_PRINT = false;   // booth build: the Mac prints the sheet instead of this iPad's print dialog
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz8CCTtf5OtnjJeY3oeSDjKSe39hJZAbXC58oG2UL_0sLvGY9Tdiv4_-eq38eJWQqUnbA/exec";
// positions on the cropped front image (1219×1700 px at 500 dpi)
const WIN = {x: 118, y: 331, w: 988, h: 638};          // transparent window the portrait shows through
const NAME = {x: 345, base: 230, maxW: 590, size: 60}; // right after "NAME :"
const NAME_FONT = '"DotGothic16"';
// 2L sheet, portrait: two trading cards (63×88 mm) lying sideways, front on top, back below, folded on the centre line
const SHEET = {w: 127, h: 178, dpi: 400}, CARD = {w: 63, h: 88}, GAP = 10, BLEED = 2;
const CX = (SHEET.w - CARD.h) / 2, TOP_Y = (SHEET.h - 2 * CARD.w - GAP) / 2, FOLD_Y = SHEET.h / 2;

const $ = id => document.getElementById(id);
const CHARS = await (await fetch("../characters.json")).json();
const cv = $("cv"), ctx = cv.getContext("2d");
let key = localStorage.getItem("yasai-staff-key") || "";
let entries = [], filter = "todo", current = null;   // current = entry from the sheet, or null for 手入力
let veg = null, art = null, view = {s: 1, dx: 0, dy: 0};
let face = null, faceReq = 0;   // the visitor's photo, shown in the window until the portrait goes in
// colour behind the portrait (shows through transparent parts of the drawing)
const BG_COLORS = ["#ffffff", "#cfe8f7", "#fff27a", "#ffd6e0", "#d4f2dc", "#e6dcf5", "#fff1d6", "#222222"];
let bg = localStorage.getItem("yasai-bg") || "#ffffff";
const fronts = {}, backs = {};
const img = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

/* ---------- entries from the sheet ---------- */
async function loadList(){
  if (!key) return askKey();
  $("listMsg").hidden = false; $("listMsg").textContent = "読み込み中…";
  try {
    const r = await (await fetch(`${ENDPOINT}?action=list&key=${encodeURIComponent(key)}`)).json();
    if (!r.ok && r.error === "bad key"){ key = ""; localStorage.removeItem("yasai-staff-key"); return askKey(); }
    if (!r.list) throw new Error("old");
    entries = r.list.sort((a, b) => a.number - b.number);
    renderList();
  } catch (e) {
    $("listMsg").textContent = e.message === "old"
      ? "受付スクリプトが古いままです。Code.gs を貼り直して、新しいバージョンでデプロイしてください。"
      : "読み込めませんでした。電波を確認して「更新」を押してください。";
  }
}
function renderList(){
  const shown = entries.filter(e => filter === "all" || !/完成|受け渡し済/.test(e.status));
  $("listMsg").hidden = !!shown.length;
  $("listMsg").textContent = entries.length ? "未完成の受付はありません。" : "まだ受付がありません。";
  $("list").replaceChildren(...shown.map(e => {
    const b = document.createElement("button");
    b.className = "entry" + (current && current.number === e.number ? " sel" : "");
    b.innerHTML = `<b></b><span class="who"><div></div><small></small></span><span class="chip"></span>`;
    b.querySelector("b").textContent = String(e.number).padStart(3, "0");
    b.querySelector(".who div").textContent = e.nickname;
    b.querySelector("small").textContent = `${e.vegetable}　${e.time}`;
    const chip = b.querySelector(".chip"); chip.textContent = e.status; chip.classList.add(e.status);
    b.onclick = () => openEntry(e);
    return b;
  }));
}
function askKey(){ $("keybox").hidden = false; $("keyIn").focus(); }
$("keyForm").onsubmit = e => {
  e.preventDefault();
  key = $("keyIn").value.trim(); if (!key) return;
  localStorage.setItem("yasai-staff-key", key);
  $("keybox").hidden = true; loadList();
};
$("reload").onclick = loadList;
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});
$("manual").onclick = () => openEntry(null);
setInterval(() => { if (key && document.visibilityState === "visible") loadList(); }, 60000);

/* ---------- editor ---------- */
$("vegs").replaceChildren(...CHARS.map(c => {
  const b = document.createElement("button");
  b.className = "veg"; b.dataset.slug = c.slug;
  b.innerHTML = `<i style="background:${c.color}"></i>${c.label}`;
  b.onclick = () => setVeg(c);
  return b;
}));
function openEntry(e){
  current = e;
  $("nick").value = e ? e.nickname : "";
  $("who").hidden = !e;
  if (e) $("who").textContent = `No.${String(e.number).padStart(3, "0")}　${e.vegetable}`;
  art = null; view = {s: 1, dx: 0, dy: 0}; $("zoom").value = 1;
  face = null; if (e) loadFace(e);
  const c = e && CHARS.find(c => c.label === e.vegetable);
  setVeg(c || null);   // おまかせ: staff picks the vegetable
  renderList();
}
async function setVeg(c){
  veg = c;
  document.querySelectorAll(".veg").forEach(b => b.classList.toggle("on", !!c && b.dataset.slug === c.slug));
  if (c){
    fronts[c.slug] ||= await img(`front/${c.slug}.png`);
    $("backImg").src = `back/${c.slug}.png`;
  } else $("backImg").removeAttribute("src");
  draw();
}
$("nick").oninput = () => draw();
async function loadFace(e){
  const req = ++faceReq;
  try {
    const r = await (await fetch(`${ENDPOINT}?action=photo&number=${e.number}&key=${encodeURIComponent(key)}`)).json();
    if (!r.ok || !r.photo) return;
    const im = await img(r.photo);
    if (req === faceReq){ face = im; draw(); }
  } catch {}
}

function coverScale(){ return Math.max((WIN.w + 8) / art.width, (WIN.h + 8) / art.height); }   // edges tuck under the frame
function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);   // corners stay transparent so the printed bleed shows through
  if (art){
    const k = coverScale() * view.s, w = art.width * k, h = art.height * k;
    ctx.save();
    ctx.beginPath(); ctx.rect(WIN.x - 4, WIN.y - 4, WIN.w + 8, WIN.h + 8); ctx.clip();   // runs a little under the frame
    ctx.fillStyle = bg; ctx.fillRect(WIN.x - 4, WIN.y - 4, WIN.w + 8, WIN.h + 8);
    ctx.drawImage(art, WIN.x + (WIN.w - w) / 2 + view.dx, WIN.y + (WIN.h - h) / 2 + view.dy, w, h);
    ctx.restore();
  } else if (face){
    // reference only: printing stays locked until the portrait is in
    const k = Math.max(WIN.w / face.width, WIN.h / face.height), w = face.width * k, h = face.height * k;
    ctx.save();
    ctx.beginPath(); ctx.rect(WIN.x, WIN.y, WIN.w, WIN.h); ctx.clip();
    ctx.drawImage(face, WIN.x + (WIN.w - w) / 2, WIN.y + (WIN.h - h) * 0.35, w, h);
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(WIN.x, WIN.y + WIN.h - 70, WIN.w, 70);
    ctx.fillStyle = "#fff"; ctx.font = `40px -apple-system,sans-serif`; ctx.textAlign = "center";
    ctx.fillText("顔写真（参考）", WIN.x + WIN.w / 2, WIN.y + WIN.h - 22); ctx.textAlign = "left";
    ctx.restore();
  } else {
    ctx.fillStyle = "#f1f1f1"; ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
    ctx.fillStyle = "#aaa"; ctx.font = `48px -apple-system,sans-serif`; ctx.textAlign = "center";
    ctx.fillText("似顔絵を選んでください", WIN.x + WIN.w / 2, WIN.y + WIN.h / 2 + 16); ctx.textAlign = "left";
  }
  if (veg && fronts[veg.slug]){   // the template may still be loading
    ctx.drawImage(fronts[veg.slug], 0, 0);
    const name = $("nick").value.trim();
    if (name){
      let size = NAME.size;
      ctx.font = `${size}px ${NAME_FONT}`;
      const w = ctx.measureText(name).width;
      if (w > NAME.maxW){ size *= NAME.maxW / w; ctx.font = `${size}px ${NAME_FONT}`; }
      ctx.fillStyle = veg.ink; ctx.textBaseline = "alphabetic";
      ctx.fillText(name, NAME.x, NAME.base);
    }
  } else {
    ctx.fillStyle = "#888"; ctx.font = `52px -apple-system,sans-serif`; ctx.textAlign = "center";
    ctx.fillText("野菜を選んでください", cv.width / 2, 200); ctx.textAlign = "left";
  }
  $("printBtn").disabled = !(veg && art);
}

/* ---------- the portrait: pick, drop, drag, pinch ---------- */
async function setArt(file){
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  try { art = await img(url); } catch { return toast("画像を読み込めませんでした。"); }
  view = {s: 1, dx: 0, dy: 0}; $("zoom").value = 1; draw();
}
$("pick").onclick = () => $("file").click();
// booth Mac: drawings AirDropped from the drawing iPad, newest first; tap one to put it in the card
const used = new Set();
async function loadInbox(){
  try {
    const r = await (await fetch(`${ENDPOINT}?action=inbox&key=${encodeURIComponent(key)}`)).json();
    if (!r.ok) return;
    $("inbox").replaceChildren(...r.files.map(f => {
      const b = document.createElement("button"), src = `${ENDPOINT}?action=inboxfile&name=${encodeURIComponent(f.name)}&key=${encodeURIComponent(key)}`;
      b.className = used.has(f.name) ? "used" : "";
      b.innerHTML = `<img loading="lazy" alt=""><small></small>`;
      b.querySelector("img").src = src; b.querySelector("small").textContent = f.time;
      b.title = f.name;
      b.onclick = async () => {
        const blob = await (await fetch(src)).blob();
        await setArt(new File([blob], f.name, {type: blob.type}));
        used.add(f.name); b.classList.add("used");
      };
      return b;
    }));
  } catch {}
}
if (SERVER_PRINT){
  $("inboxBox").hidden = false;
  setInterval(() => { if (key && document.visibilityState === "visible") loadInbox(); }, 4000);
}
$("file").onchange = e => { setArt(e.target.files[0]); e.target.value = ""; };
const front = $("front");
front.addEventListener("dragover", e => { e.preventDefault(); $("drop").hidden = false; });
front.addEventListener("dragleave", () => { $("drop").hidden = true; });
front.addEventListener("drop", e => { e.preventDefault(); $("drop").hidden = true; setArt(e.dataTransfer.files[0]); });
function setBg(c){
  bg = c; localStorage.setItem("yasai-bg", c); $("bgPick").value = c;
  document.querySelectorAll("#bgs button").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  draw();
}
$("bgs").prepend(...BG_COLORS.map(c => {
  const b = document.createElement("button");
  b.dataset.c = c; b.style.background = c; b.setAttribute("aria-label", c);
  b.onclick = () => setBg(c);
  return b;
}));
$("bgPick").oninput = e => setBg(e.target.value);
$("zoom").oninput = e => { view.s = +e.target.value; draw(); };
$("fit").onclick = () => { view = {s: 1, dx: 0, dy: 0}; $("zoom").value = 1; draw(); };

const pts = new Map(); let last = null;
const toCard = () => cv.width / cv.getBoundingClientRect().width;
function gesture(){
  const p = [...pts.values()];
  const c = {x: p.reduce((s, q) => s + q.x, 0) / p.length, y: p.reduce((s, q) => s + q.y, 0) / p.length};
  const d = p.length > 1 ? Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) : 0;
  return {c, d, n: p.length};
}
cv.addEventListener("pointerdown", e => { if (!art) return; cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); last = gesture(); });
cv.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const g = gesture(), k = toCard();
  if (last && g.n === last.n){
    view.dx += (g.c.x - last.c.x) * k; view.dy += (g.c.y - last.c.y) * k;
    if (g.n > 1 && last.d) view.s = Math.min(3, Math.max(1, view.s * g.d / last.d));
    $("zoom").value = view.s; draw();
  }
  last = g;
});
const up = e => { pts.delete(e.pointerId); last = pts.size ? gesture() : null; };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

/* ---------- print ---------- */
// colour of the card's outer frame, used to run the frame 2 mm past the cut line
function edgeColor(im){
  const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const [r, g, b] = x.getImageData(Math.round(im.width * 0.004), Math.round(im.height / 2), 1, 1).data;
  return `rgb(${r},${g},${b})`;
}
async function buildSheet(){
  const back = backs[veg.slug] ||= await img(`back/${veg.slug}.png`);
  const mm = SHEET.dpi / 25.4, c = document.createElement("canvas");
  c.width = Math.round(SHEET.w * mm); c.height = Math.round(SHEET.h * mm);
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  // both cards lie with their top towards the left edge, so the back reads upright after folding
  for (const [im, edge, y0] of [[cv, edgeColor(fronts[veg.slug]), TOP_Y], [back, edgeColor(back), TOP_Y + CARD.w + GAP]]){
    x.save();
    x.translate((CX + CARD.h / 2) * mm, (y0 + CARD.w / 2) * mm);
    x.rotate(-Math.PI / 2);
    x.fillStyle = edge;
    x.fillRect(-(CARD.w / 2 + BLEED) * mm, -(CARD.h / 2 + BLEED) * mm, (CARD.w + 2 * BLEED) * mm, (CARD.h + 2 * BLEED) * mm);
    const h = CARD.h * mm, w = h * im.width / im.height;   // fit the height; the width differs by under 0.1 mm
    x.beginPath(); x.rect(-CARD.w / 2 * mm, -h / 2, CARD.w * mm, h); x.clip();
    x.drawImage(im, -w / 2, -h / 2, w, h);
    x.restore();
  }
  // fold line ticks and cut ticks, all in the margins that get cut away
  x.strokeStyle = "#999"; x.lineWidth = 0.15 * mm;
  const tick = (x1, y1, x2, y2) => { x.beginPath(); x.moveTo(x1 * mm, y1 * mm); x.lineTo(x2 * mm, y2 * mm); x.stroke(); };
  tick(2, FOLD_Y, CX - BLEED - 2, FOLD_Y); tick(CX + CARD.h + BLEED + 2, FOLD_Y, SHEET.w - 2, FOLD_Y);
  for (const cx of [CX, CX + CARD.h]){ tick(cx, 4, cx, TOP_Y - BLEED - 1); tick(cx, SHEET.h - 4, cx, SHEET.h - TOP_Y + BLEED + 1); }
  for (const cy of [TOP_Y, TOP_Y + CARD.w, TOP_Y + CARD.w + GAP, TOP_Y + 2 * CARD.w + GAP]){ tick(2, cy, CX - BLEED - 1, cy); tick(CX + CARD.h + BLEED + 1, cy, SHEET.w - 2, cy); }
  x.fillStyle = "#999"; x.font = `${2.6 * mm}px -apple-system,sans-serif`; x.textAlign = "center";
  x.fillText("中央の線で山折り（印刷面を外に）", SHEET.w / 2 * mm, (TOP_Y - BLEED - 4) * mm);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
}
let sheetUrl = "";
$("scale").value = localStorage.getItem("yasai-print-scale") || 100;
$("scale").onchange = e => localStorage.setItem("yasai-print-scale", e.target.value);
$("printBtn").onclick = async () => {
  $("printBtn").disabled = true;
  if (SERVER_PRINT){
    const number = current ? current.number : 0;
    try {
      const body = await buildSheet();
      const r = await (await fetch(`${ENDPOINT}?action=print&number=${number}&scale=${(+$("scale").value || 100) / 100}&key=${encodeURIComponent(key)}`, {method: "POST", body})).json();
      if (!r.ok) throw new Error(r.error);
      toast(current ? `No.${String(number).padStart(3, "0")} を Mac から印刷しています。` : "Mac から印刷しています。", !!current);
    } catch (e) {
      toast(`印刷できませんでした：${e.message || "Mac につながりません"}`);
    } finally { $("printBtn").disabled = false; }
    return;
  }
  URL.revokeObjectURL(sheetUrl);
  sheetUrl = URL.createObjectURL(await buildSheet());
  $("pSheet").src = sheetUrl;
  $("pSheet").style.setProperty("--k", (+$("scale").value || 100) / 100);
  await $("pSheet").decode().catch(() => {});
  $("printBtn").disabled = false;
  window.print();
  if (current) toast(`No.${String(current.number).padStart(3, "0")} を印刷しました。`, true);
};
let doneFor = null;
function toast(text, offerDone){
  $("toastText").textContent = text;
  doneFor = offerDone ? current : null;
  $("toastDo").hidden = !offerDone;
  $("toast").hidden = false;
}
$("toastX").onclick = () => { $("toast").hidden = true; };
$("toastDo").onclick = async () => {
  const e = doneFor; $("toast").hidden = true; if (!e) return;
  try {
    const r = await (await fetch(`${ENDPOINT}?action=done&number=${e.number}&key=${encodeURIComponent(key)}`)).json();
    if (!r.ok) throw 0;
    e.status = "完成"; renderList();
  } catch { toast("完成にできませんでした。スプレッドシートで直接変えてください。"); }
};

await document.fonts.load(`60px ${NAME_FONT}`, "あアA");
setBg(bg);
openEntry(null);
loadList();
if (SERVER_PRINT) loadInbox();
