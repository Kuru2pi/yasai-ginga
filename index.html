<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}[hidden]{display:none!important}</style>
</head>
<body>
<title>ヤサイギンガ キーホルダー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ヤサイギンガ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-screen swiper of hanging keychains; name floats top-left, description and dots float at the bottom */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#777777; --line:#dddddd;
  --tint:#888888;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:440px;margin-inline:auto;overflow:hidden}
/* on a computer, show the phone layout as a centred column */
@media (min-width:520px){body{background:#f4f4f4}.app{background:var(--bg);border-inline:1px solid var(--line)}}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

header,footer{position:absolute;left:0;right:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));pointer-events:none}
header{top:0;padding-block:18px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.sub{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.count{font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{bottom:0;padding-block:0 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
footer p{margin:0;font-size:13px;line-height:1.7;color:var(--fg);max-width:34em;text-align:center;min-height:5.1em}
.dots{display:flex;gap:6px;pointer-events:auto}
.dots button{width:6px;height:6px;padding:0;border:0;border-radius:3px;background:var(--line);cursor:pointer;transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:18px;background:var(--fg)}
.dots button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.flip{position:absolute;left:50%;top:70%;transform:translate(-50%,0);width:56px;height:56px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;cursor:pointer;color:#1a1a1a;isolation:isolate;
  /* glass: a lens-like fill lit from the top-left, tinted faintly by the character's colour */
  background:
    radial-gradient(120% 120% at 28% 18%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.45) 38%,rgba(255,255,255,.12) 68%,rgba(255,255,255,.3) 100%),
    linear-gradient(180deg,color-mix(in srgb,var(--tint) 2%,transparent),color-mix(in srgb,var(--tint) 7%,transparent));
  -webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);
  box-shadow:
    0 14px 28px -10px rgba(0,0,0,.22),
    0 3px 8px rgba(0,0,0,.10),
    inset 0 2px 1px rgba(255,255,255,.95),
    inset 0 -12px 18px -8px rgba(0,0,0,.06),
    inset 0 0 0 1px rgba(255,255,255,.45)}
/* bevelled rim: bright where the light hits, darker on the far side */
.flip::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;z-index:-1;
  background:linear-gradient(145deg,#fff 0%,rgba(255,255,255,.2) 35%,rgba(0,0,0,.18) 65%,rgba(255,255,255,.9) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* specular glint */
.flip::after{content:"";position:absolute;top:7px;left:12px;width:22px;height:10px;border-radius:50%;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));transform:rotate(-24deg)}
.flip svg{width:24px;height:24px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.flip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.1em;color:var(--muted);pointer-events:none}

/* ---- entry: call-to-action, form and ticket ---- */
.cta{pointer-events:auto;font:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--fg);border:0;border-radius:999px;padding:13px 28px;cursor:pointer}
.cta:focus-visible,.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.ticket-link{pointer-events:auto;font:inherit;font-size:11px;letter-spacing:.06em;color:var(--fg);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-top:6px;cursor:pointer}
.panel{position:absolute;inset:0;z-index:5;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.panel-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding-block:14px 10px;background:var(--bg)}
.panel-head h2{margin:0;font-size:18px;font-weight:700}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--fg);cursor:pointer;margin-left:-8px}
.icon-btn svg{width:22px;height:22px}
.chosen{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.chosen i{width:14px;height:14px;border-radius:50%;flex:none}
.chosen small{margin-left:auto;color:var(--muted);font-size:12px}
form{display:flex;flex-direction:column;gap:22px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>span{font-size:13px;font-weight:700}
.field>span em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
input[type=text],input[type=tel],textarea{font:inherit;font-size:16px;color:var(--fg);background:#fff;border:1px solid #cfcfcf;border-radius:10px;padding:12px 14px;width:100%;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{outline:2px solid var(--fg);outline-offset:-1px;border-color:transparent}
textarea{resize:none;min-height:72px}
.at{position:relative}.at::before{content:"@";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.at input{padding-left:32px}
.at input:disabled{background:#f4f4f4;color:var(--muted)}
.photo{position:relative;display:grid;place-items:center;aspect-ratio:1/1;width:min(100%,220px);align-self:center;border:1.5px dashed #bdbdbd;border-radius:18px;overflow:hidden;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.photo.has{border-style:solid;border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0}
.chips span{display:inline-block;font-size:14px;padding:9px 16px;border:1px solid #cfcfcf;border-radius:999px;cursor:pointer}
.chips input:checked+span{background:var(--fg);border-color:var(--fg);color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--fg)}
.err{margin:0;font-size:13px;color:#c62828;min-height:1.2em}
.btn{font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--fg);border:0;border-radius:999px;padding:15px;width:100%;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:400}

/* the ticket people screenshot and send by DM */
.ticket{--c:#111;position:relative;margin-top:8px;border:2px solid var(--c);border-radius:18px;padding:18px;background:#fff;overflow:hidden}
/* perforation with punched notches between the number and the details */
.t-cut{position:relative;margin:16px -20px 0;border-top:2px dashed color-mix(in srgb,var(--c) 45%,#fff)}
.t-cut::before,.t-cut::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--c)}
.t-cut::before{left:-12px}.t-cut::after{right:-12px}
.t-eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.t-title{font-size:13px;font-weight:700;margin-top:2px}
.t-no{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
.t-no b{font-size:56px;line-height:1;font-weight:700;letter-spacing:.02em;color:var(--c);font-variant-numeric:tabular-nums}
.t-no small{font-size:12px;color:var(--muted)}
.t-body{display:flex;gap:14px;margin-top:18px;align-items:center}
.t-body img{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:none;background:#eee}
.t-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;min-width:0}
.t-body dt{color:var(--muted);font-size:12px}
.t-body dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.t-demo{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:.1em;color:#c62828;border:1px solid #c62828;border-radius:4px;padding:2px 6px}
.steps{margin:22px 0 14px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.steps li{display:flex;gap:10px;align-items:center}
.steps li b{width:22px;height:22px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:10px 0 18px;text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.panel{animation:none}}
</style>

<div class="app" id="app">
  <div class="load" id="load">LOADING</div>
  <header id="header">
    <div>
      <h1 id="veg">トマト</h1>
      <div class="sub" id="sub">TOMATO · TM01</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end">
      <div class="count" id="count">01 / 10</div>
      <button class="ticket-link" id="openTicket" hidden>受付票</button>
    </div>
  </header>
  <footer id="footer">
    <p id="desc"></p>
    <button class="cta" id="apply">この野菜で似顔絵を申し込む</button>
    <div class="dots" id="dots" role="tablist" aria-label="キャラクター"></div>
  </footer>
  <button class="flip" id="flip" aria-label="裏返す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 11a8 8 0 0 0-14.3-4.9"/><path d="M5.5 2.5v4h4"/>
      <path d="M4 13a8 8 0 0 0 14.3 4.9"/><path d="M18.5 21.5v-4h-4"/>
    </svg>
  </button>

  <section class="panel" id="formPanel" hidden aria-labelledby="formTitle">
    <div class="panel-head">
      <button class="icon-btn" id="closeForm" aria-label="もどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="formTitle">似顔絵の受付</h2>
    </div>
    <div class="chosen"><i id="chosenDot"></i><span id="chosenName">トマト星人</span><small>野菜を変えるときは「もどる」</small></div>
    <form id="entry" novalidate>
      <label class="photo" id="photoBox">
        <input type="file" id="photo" accept="image/*">
        <img id="photoPreview" alt="" hidden>
        <span id="photoHint">タップして<br>顔写真を撮る・選ぶ</span>
      </label>
      <label class="field"><span>ニックネーム</span>
        <input type="text" id="nick" maxlength="20" autocomplete="nickname" placeholder="例：じゅん">
      </label>
      <div class="field"><span>似顔絵の希望</span>
        <div class="chips" role="radiogroup">
          <label><input type="radio" name="wish" value="かっこよく"><span>かっこよく</span></label>
          <label><input type="radio" name="wish" value="かわいく"><span>かわいく</span></label>
          <label><input type="radio" name="wish" value="おもしろく"><span>おもしろく</span></label>
          <label><input type="radio" name="wish" value="おまかせ" checked><span>おまかせ</span></label>
        </div>
        <textarea id="note" maxlength="100" placeholder="ひとこと（任意）例：メガネは外して描いてほしい"></textarea>
      </div>
      <div class="field"><span>Instagram<em>完成のお知らせを DM で送ります</em></span>
        <div class="at"><input type="text" id="ig" maxlength="30" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="instagram_id"></div>
        <label class="check"><input type="checkbox" id="noIg">Instagram を持っていない</label>
      </div>
      <label class="field"><span>電話番号</span>
        <input type="tel" id="tel" maxlength="15" autocomplete="tel" placeholder="090-1234-5678">
      </label>
      <label class="check"><input type="checkbox" id="agree"><span id="agreeText">顔写真と連絡先は、似顔絵の制作と完成のお知らせだけに使い、芸術祭の終了後に削除します。</span></label>
      <p class="err" id="formErr" role="alert"></p>
      <button class="btn" type="submit" id="submitBtn">この内容で受付する</button>
    </form>
  </section>

  <section class="panel" id="ticketPanel" hidden aria-labelledby="ticketTitle">
    <div class="panel-head">
      <button class="icon-btn" id="closeTicket" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="ticketTitle">受付が完了しました</h2>
    </div>
    <div class="ticket" id="ticket">
      <span class="t-demo" id="tDemo" hidden>TEST</span>
      <div class="t-eyebrow">ヤサイギンガ 星間航旅券</div>
      <div class="t-title">似顔絵 受付票</div>
      <div class="t-no"><b id="tNo">12</b><small id="tTime"></small></div>
      <div class="t-cut"></div>
      <div class="t-body">
        <img id="tPhoto" alt="">
        <dl>
          <dt>なまえ</dt><dd id="tNick"></dd>
          <dt>野菜</dt><dd id="tVeg"></dd>
          <dt>希望</dt><dd id="tWish"></dd>
        </dl>
      </div>
    </div>
    <ol class="steps">
      <li><b>1</b>この画面をスクショ</li>
      <li><b>2</b>下のボタンから DM で送ってね</li>
    </ol>
    <div class="stack">
      <button class="btn" id="dmBtn">Instagram で DM を送る</button>
      <p class="note" id="dmNote">ボタンを押すと受付内容もコピーされます。<br>完成したら DM でお知らせします。番号は控えておいてね。</p>
      <button class="btn ghost" id="backToKeys">キーホルダーにもどる</button>
    </div>
  </section>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

/* ---------- settings for the festival booth ---------- */
const CONFIG = {
  endpoint: "",    // Google Apps Script web-app URL (…/exec). Empty = test mode: nothing is sent
  instagram: "",   // booth account the DM button opens, without @
};

const CHARS = window.CHARS || await (await fetch("characters.json")).json();
const EMBED = window.EMBED || null;
const $ = id => document.getElementById(id);
const N = CHARS.length;
CHARS.forEach(c => { const [num, en] = c.id.split(" / ")[0].split("."); c.num = num; c.en = en; c.code = c.id.split(" / ")[1]; });

/* ---------- renderer ---------- */
const app = $("app");
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 0.6));
const FOV = 30, TAN = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.005, 5);

/* ---------- models ---------- */
const rigs = new Array(N).fill(null), pending = {};
const slots = CHARS.map(() => new THREE.Group());
function load(i){
  if (i < 0 || i >= N || rigs[i] || pending[i]) return pending[i];
  const k = CHARS[i].slug;
  const fromB64 = t => Uint8Array.from(atob(t.trim()), ch => ch.charCodeAt(0)).buffer;
  // models ship as base64 text (b64/<slug>.txt) because artifacts don't serve .glb
  const src = EMBED ? Promise.resolve(fromB64(EMBED[k])) : fetch(`b64/${k}.txt`).then(r => r.ok ? r : fetch(`${k}.txt`)).then(r => r.text()).then(fromB64);   // b64/ folder, or flat next to the page
  return pending[i] = src.then(buf => new Promise((res, rej) => new GLTFLoader().parse(buf, "", res, rej))).then(g => {
    g.scene.traverse(o => {
      if (!o.isMesh) return;
      if (/print/.test(o.material.name)) o.material = new THREE.MeshBasicMaterial({map: o.material.map, toneMapped: false});
      if (o.material.transparent){ o.material.depthWrite = false; o.material.envMapIntensity = 0.5; o.renderOrder = 2; }
    });
    const root = g.scene.getObjectByName("Yasai_Keychain");
    const segs = [];
    root.traverse(o => { if (o.name.startsWith("seg_")) segs.push(o); });
    segs.sort((a, b) => depth(a) - depth(b));
    slots[i].add(g.scene);
    rigs[i] = new Rig(segs, root.userData.pivots_mm.map(v => v / 1000), (Math.random() - .5) * 0.12);
    if (i === cur) $("load").hidden = true;
  });
}
function depth(o){ let d = 0; while (o.parent){ d++; o = o.parent; } return d; }

/* ---------- physics: a chain of rigid parts hanging from the clasp (position-based dynamics) ---------- */
const H = 1 / 240, DOWN = new THREE.Vector3(0, -1, 0), YAX = new THREE.Vector3(0, 1, 0);
const _qT = new THREE.Quaternion(), _qW = new THREE.Quaternion(), _qP = new THREE.Quaternion(), _d = new THREE.Vector3();
class Rig {
  constructor(segs, pivots, kick){
    this.segs = segs;
    this.P = pivots.map(y => new THREE.Vector3(0, y, 0));
    this.Q = pivots.map(y => new THREE.Vector3(0, y, 0));
    const n = this.P.length;
    this.w = this.P.map((_, i) => i === 0 ? 0 : i >= n - 2 ? 0.08 : i === 1 ? 0.5 : 1);
    this.rest = pivots.slice(1).map((y, i) => pivots[i] - y);
    this.twist = 0; this.omega = 0; this.target = 0;
    this.push(kick, 0, 0);
  }
  push(vx, vy, vz){ const n = this.P.length; for (const i of [n - 2, n - 1]){ this.Q[i].x -= vx * H; this.Q[i].y -= vy * H; this.Q[i].z -= vz * H; } }
  step(g){
    const {P, Q, w, rest} = this, n = P.length, damp = Math.exp(-2.2 * H);
    for (let i = 1; i < n; i++){
      const p = P[i], q = Q[i];
      const vx = (p.x - q.x) * damp, vy = (p.y - q.y) * damp, vz = (p.z - q.z) * damp;
      q.copy(p); p.x += vx + g.x * H * H; p.y += vy + g.y * H * H; p.z += vz + g.z * H * H;
    }
    for (let it = 0; it < 6; it++) for (let i = 0; i < n - 1; i++){
      const a = P[i], b = P[i + 1], wa = w[i], wb = w[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const len = Math.hypot(dx, dy, dz) || 1e-9, k = (len - rest[i]) / len / (wa + wb);
      a.x += wa * k * dx; a.y += wa * k * dy; a.z += wa * k * dz;
      b.x -= wb * k * dx; b.y -= wb * k * dy; b.z -= wb * k * dz;
    }
    for (let i = 1; i < n; i++) P[i].z = THREE.MathUtils.clamp(P[i].z, -0.06, 0.06);
  }
  spin(dt){
    this.omega += (28 * (this.target - this.twist) - 6 * this.omega) * dt;
    this.twist += this.omega * dt;
  }
  pose(){
    _qT.setFromAxisAngle(YAX, this.twist); _qP.identity();
    this.segs.forEach((s, i) => {
      _d.subVectors(this.P[i + 1], this.P[i]).normalize();
      _qW.setFromUnitVectors(DOWN, _d).multiply(_qT);
      s.quaternion.copy(_qP).invert().multiply(_qW);
      _qP.copy(_qW);
    });
  }
  get center(){ return this.P[this.P.length - 1]; }
}

/* ---------- swiper state ---------- */
let pos = 0, posVel = 0, prevPosVel = 0, target = 0, cur = -1;
let spacing = 0.07, baseDist = 0.4, zoom = 1, zoomTarget = 1, zoomMin = 0.3;
const dots = $("dots");
CHARS.forEach((c, i) => {
  const d = document.createElement("button");
  d.setAttribute("role", "tab"); d.setAttribute("aria-label", c.label);
  d.onclick = () => { target = i; };
  dots.appendChild(d);
});
function show(i){
  if (i === cur) return;
  cur = i;
  const c = CHARS[i];
  $("veg").textContent = c.label;
  $("sub").textContent = `${c.en} · ${c.code}`;
  $("count").textContent = `${String(i + 1).padStart(2, "0")} / ${N}`;
  $("desc").textContent = c.desc;
  $("flip").style.setProperty("--tint", c.color);
  [...dots.children].forEach((d, j) => d.setAttribute("aria-current", j === i));
  $("load").hidden = !!rigs[i];
  for (let j = i - 2; j <= i + 2; j++) load(j);
}
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") target = Math.min(target + 1, N - 1);
  if (e.key === "ArrowLeft") target = Math.max(target - 1, 0);
});

/* ---------- touch: swipe to change, tap to zoom in/out, pinch to zoom; the button flips ---------- */
const canvas = renderer.domElement, pts = new Map();
let drag = null, pinch0 = 0, zoom0 = 1, asked = false;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = zoom; drag = null; return; }
  drag = {x0: e.clientX, y0: e.clientY, x: e.clientX, t: performance.now(), t0: performance.now(), v: 0, pos0: pos};
});
canvas.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size === 2){
    const [a, b] = [...pts.values()];
    zoom = zoomTarget = THREE.MathUtils.clamp(zoom0 * pinch0 / Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1), zoomMin, 1);
    return;
  }
  if (!drag) return;
  const now = performance.now(), dt = Math.max((now - drag.t) / 1000, 1 / 240);
  const pxPerSlide = spacing / (2 * baseDist * zoom * TAN) * canvas.clientHeight;
  const dx = e.clientX - drag.x;
  drag.v = 0.7 * drag.v + 0.3 * (-dx / pxPerSlide / dt);
  pos = THREE.MathUtils.clamp(drag.pos0 - (e.clientX - drag.x0) / pxPerSlide, -0.35, N - 0.65);
  drag.x = e.clientX; drag.t = now;
});
function release(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (!drag) return;
  const now = performance.now(), moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  // iOS asks for motion access only from a gesture; ask once, quietly, on the first touch
  if (!asked && typeof DeviceMotionEvent?.requestPermission === "function"){ asked = true; DeviceMotionEvent.requestPermission().catch(() => {}); }
  if (moved < 10 && now - drag.t0 < 300){
    zoomTarget = zoomTarget < (1 + zoomMin) / 2 ? 1 : zoomMin;   // tap: card fills the screen, tap again: back
  } else {
    posVel = drag.v;
    target = THREE.MathUtils.clamp(Math.round(pos + THREE.MathUtils.clamp(drag.v * 0.12, -1, 1)), 0, N - 1);
  }
  drag = null;
}
canvas.addEventListener("pointerup", release);
$("flip").onclick = () => { const r = rigs[cur]; if (r) r.target = Math.round(r.target / Math.PI) * Math.PI + Math.PI; };
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("wheel", e => { e.preventDefault(); zoom = zoomTarget = THREE.MathUtils.clamp(zoom * Math.exp(e.deltaY * 0.001), zoomMin, 1); }, {passive: false});

/* ---------- tilt & shake: the phone's own gravity and motion, where the browser shares it ---------- */
const grav = new THREE.Vector3(0, -9.8, 0);
let sign = 0;
addEventListener("devicemotion", e => {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  if (!sign){   // spec: reading points "up" at rest; some browsers flip it — calibrate once
    if (Math.hypot(a.x, a.y, a.z) < 5) return;
    const dom = Math.abs(a.y) > Math.abs(a.z) ? a.y : a.z;
    sign = dom > 0 ? -1 : 1;
  }
  const ang = (screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI / 180, c = Math.cos(ang), s = Math.sin(ang);
  grav.set(sign * (a.x * c + a.y * s), sign * (-a.x * s + a.y * c), sign * a.z);
  if (grav.length() > 30) grav.setLength(30);
});

/* ---------- layout: fit the whole keychain between the header and footer, card at screen centre ---------- */
let camY0 = 0;
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  // the card (tab top +47.8 mm to bottom -41 mm) plus the flip button fit between the title and the
  // description; the clasp may rise beside the title, never over text
  const CT = 0.0478, CB = 0.041, BTN = 56 + 12;
  const regTop = $("header").offsetHeight + 10, regBot = $("footer").offsetTop - 10, regH = regBot - regTop;
  const pxPerM = Math.min((regH - BTN) / (CT + CB), 0.70 * w / 0.06);   // card ≈ 70% of the screen width
  const blockTop = regTop + (regH - (CT + CB) * pxPerM - BTN) / 2;
  const cardZero = blockTop + CT * pxPerM;   // screen y of the card's centre
  const halfH = h / 2 / pxPerM;
  camY0 = (cardZero - h / 2) / pxPerM;
  baseDist = halfH / TAN;
  const halfW = halfH * camera.aspect, peek = Math.max(0.006, 0.2 * halfW);
  spacing = Math.min(halfW - peek + 0.03 * 0.82, 0.085);
  zoomMin = Math.min(1, 0.0306 / halfW);   // closest zoom: the card spans the full width
  zoom = THREE.MathUtils.clamp(zoom, zoomMin, 1); zoomTarget = THREE.MathUtils.clamp(zoomTarget, zoomMin, 1);
  $("flip").style.top = (blockTop + (CT + CB) * pxPerM + 12).toFixed(1) + "px";
}
new ResizeObserver(resize).observe(app);
resize();

/* ---------- entry: form → Google Sheet → ticket to screenshot and DM ---------- */
const formPanel = $("formPanel"), ticketPanel = $("ticketPanel");
let photoData = "";
const TICKET_KEY = "yasai-ticket";
const loadTicket = () => { try { return JSON.parse(localStorage.getItem(TICKET_KEY) || "null"); } catch { return null; } };
const saveTicket = t => { try { localStorage.setItem(TICKET_KEY, JSON.stringify(t)); } catch {} };
$("openTicket").hidden = !loadTicket();

$("apply").onclick = () => {
  const c = CHARS[cur];
  $("chosenDot").style.background = c.color;
  $("chosenName").textContent = `${c.label}星人`;
  $("formErr").textContent = "";
  formPanel.hidden = false; formPanel.scrollTop = 0;
};
$("closeForm").onclick = () => { formPanel.hidden = true; };
$("ig").oninput = e => { e.target.value = e.target.value.replace(/[@\s]/g, ""); };   // the field already shows "@"
$("noIg").onchange = e => { $("ig").disabled = e.target.checked; if (e.target.checked) $("ig").value = ""; };

// shrink the photo on the phone before sending: long side 1000 px, JPEG
$("photo").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const url = URL.createObjectURL(f);
    const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    photoData = cv.toDataURL("image/jpeg", 0.85);
    $("photoPreview").src = photoData; $("photoPreview").hidden = false;
    $("photoHint").hidden = true; $("photoBox").classList.add("has");
  } catch {
    $("formErr").textContent = "写真を読み込めませんでした。別の写真で試してください。";
  }
};

$("entry").onsubmit = async e => {
  e.preventDefault();
  const err = m => { $("formErr").textContent = m; };
  const nick = $("nick").value.trim(), ig = $("ig").value.trim().replace(/^@/, ""), noIg = $("noIg").checked;
  const tel = $("tel").value.trim(), digits = tel.replace(/\D/g, "");
  if (!photoData) return err("顔写真を撮るか選んでください。");
  if (!nick) return err("ニックネームを入れてください。");
  if (!noIg && !/^[A-Za-z0-9._]{1,30}$/.test(ig)) return err("Instagram の ID を確認してください（持っていない人はチェックを入れてください）。");
  if (digits.length < 10 || digits.length > 11) return err("電話番号を確認してください（ハイフンはあってもなくても大丈夫です）。");
  if (!$("agree").checked) return err("下の内容に同意のチェックを入れてください。");
  err("");
  const c = CHARS[cur];
  const entry = {vegetable: c.label, nickname: nick, wish: document.querySelector("input[name=wish]:checked").value,
                 note: $("note").value.trim(), instagram: noIg ? "" : ig, phone: tel};
  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = "送信中…";
  try {
    let number, time, demo = false;
    if (CONFIG.endpoint){
      // text/plain keeps this a "simple" request, which Apps Script accepts without a CORS preflight
      const res = await fetch(CONFIG.endpoint, {method: "POST", body: JSON.stringify({...entry, photo: photoData})});
      const r = await res.json();
      if (!r.ok) throw new Error(r.error || "failed");
      ({number, time} = r);
    } else {
      demo = true; number = Math.floor(Math.random() * 90) + 10;
      time = new Date().toLocaleString("ja-JP", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"});
    }
    const ticket = {...entry, number, time, demo, color: c.color, photo: photoData};
    saveTicket(ticket);
    $("openTicket").hidden = false;
    $("entry").reset(); $("ig").disabled = false;
    photoData = ""; $("photoPreview").hidden = true; $("photoHint").hidden = false; $("photoBox").classList.remove("has");
    formPanel.hidden = true;
    showTicket(ticket);
  } catch {
    err("送信できませんでした。電波のよい場所でもう一度お試しいただくか、スタッフに声をかけてください。");
  } finally {
    btn.disabled = false; btn.textContent = "この内容で受付する";
  }
};

function showTicket(t){
  $("ticket").style.setProperty("--c", t.color);
  $("tNo").textContent = t.number; $("tTime").textContent = `${t.time} 受付`;
  $("tPhoto").src = t.photo || ""; $("tNick").textContent = t.nickname;
  $("tVeg").textContent = `${t.vegetable}星人`; $("tWish").textContent = t.wish;
  $("tDemo").hidden = !t.demo;
  $("dmBtn").disabled = !CONFIG.instagram;
  if (!CONFIG.instagram) $("dmNote").textContent = "（DM の送り先がまだ設定されていません）";
  ticketPanel.hidden = false; ticketPanel.scrollTop = 0;
}
$("openTicket").onclick = () => { const t = loadTicket(); if (t) showTicket(t); };
$("closeTicket").onclick = $("backToKeys").onclick = () => { ticketPanel.hidden = true; };
$("dmBtn").onclick = () => {
  const t = loadTicket(); if (!t || !CONFIG.instagram) return;
  const text = `【ヤサイギンガ 似顔絵受付】\nNo.${t.number}\n${t.nickname}／${t.vegetable}星人／${t.wish}`;
  const go = () => { location.href = `https://ig.me/m/${CONFIG.instagram}`; };
  // copy inside the tap, then open the booth's DM thread
  (navigator.clipboard?.writeText(text) ?? Promise.reject()).catch(() => {}).finally(go);
};

/* ---------- loop ---------- */
let acc = 0, prevT = performance.now();
const g2 = new THREE.Vector3();
show(0);
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - prevT) / 1000, 0.05); prevT = t;
  if (!formPanel.hidden || !ticketPanel.hidden) return;   // a full-screen panel covers the 3D view
  if (!drag){
    posVel += (90 * (target - pos) - 19 * posVel) * dt;
    pos += posVel * dt;
  }
  // the swiper's own acceleration nudges the keychains, like carrying them sideways
  const posAcc = THREE.MathUtils.clamp((posVel - prevPosVel) / Math.max(dt, 1e-3), -40, 40); prevPosVel = posVel;
  g2.copy(grav); g2.x += spacing * posAcc * 0.5;
  show(THREE.MathUtils.clamp(Math.round(pos), 0, N - 1));

  acc += dt;
  const steps = Math.floor(acc / H); acc -= steps * H;
  slots.forEach((slot, i) => {
    const off = i - pos, vis = Math.abs(off) < 2.2;
    if (vis && !slot.parent) scene.add(slot);
    if (!vis && slot.parent) scene.remove(slot);
    if (!vis) return;
    const s = 1 - 0.18 * Math.min(Math.abs(off), 1);
    slot.position.set(off * spacing, 0, 0); slot.scale.setScalar(s);
    const r = rigs[i]; if (!r) return;
    for (let k = 0; k < steps; k++) r.step(g2);
    r.spin(dt); r.pose();
  });

  if (pts.size < 2) zoom += (zoomTarget - zoom) * (1 - Math.exp(-9 * dt));
  // zooming in follows the centred card so its print stays readable
  const r = rigs[cur], f = zoomMin < 1 ? (1 - zoom) / (1 - zoomMin) : 0;
  const ui = String(THREE.MathUtils.clamp(1 - f * 2.5, 0, 1));   // overlay text steps aside while zoomed
  if ($("header").style.opacity !== ui){ $("header").style.opacity = ui; $("footer").style.opacity = ui; }
  const tx = f * ((cur - pos) * spacing + (r ? r.center.x : 0)), ty = camY0 * (1 - f) + (r ? r.center.y * f : 0);
  camera.position.set(tx, ty, baseDist * zoom); camera.lookAt(tx, ty, 0);
  renderer.render(scene, camera);
});
</script>

</body>
</html>
