<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}[hidden]{display:none!important}</style>
</head>
<body>
<title>ヤサイギンガ キーホルダー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ヤサイギンガ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: full-screen swiper of hanging keychains; name floats top-left, description and dots float at the bottom */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#777777; --line:#dddddd;
  --tint:#888888;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:440px;margin-inline:auto;overflow:hidden}
/* on a computer, show the phone layout as a centred column */
@media (min-width:520px){body{background:#f4f4f4}.app{background:var(--bg);border-inline:1px solid var(--line)}}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

header,footer{position:absolute;left:0;right:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));pointer-events:none}
header{top:0;padding-block:18px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.sub{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.count{font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{bottom:0;padding-block:0 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
footer p{margin:0;font-size:13px;line-height:1.7;color:var(--fg);max-width:34em;text-align:center;min-height:5.1em}
.dots{display:flex;gap:6px;pointer-events:auto}
.dots button{width:6px;height:6px;padding:0;border:0;border-radius:3px;background:var(--line);cursor:pointer;transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:18px;background:var(--fg)}
.dots button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.flip{position:absolute;left:50%;top:70%;transform:translate(-50%,0);width:56px;height:56px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;cursor:pointer;color:#1a1a1a;isolation:isolate;
  /* glass: a lens-like fill lit from the top-left, tinted faintly by the character's colour */
  background:
    radial-gradient(120% 120% at 28% 18%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.45) 38%,rgba(255,255,255,.12) 68%,rgba(255,255,255,.3) 100%),
    linear-gradient(180deg,color-mix(in srgb,var(--tint) 2%,transparent),color-mix(in srgb,var(--tint) 7%,transparent));
  -webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);
  box-shadow:
    0 14px 28px -10px rgba(0,0,0,.22),
    0 3px 8px rgba(0,0,0,.10),
    inset 0 2px 1px rgba(255,255,255,.95),
    inset 0 -12px 18px -8px rgba(0,0,0,.06),
    inset 0 0 0 1px rgba(255,255,255,.45)}
/* bevelled rim: bright where the light hits, darker on the far side */
.flip::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;z-index:-1;
  background:linear-gradient(145deg,#fff 0%,rgba(255,255,255,.2) 35%,rgba(0,0,0,.18) 65%,rgba(255,255,255,.9) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* specular glint */
.flip::after{content:"";position:absolute;top:7px;left:12px;width:22px;height:10px;border-radius:50%;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));transform:rotate(-24deg)}
.flip svg{width:24px;height:24px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.flip:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.load{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;letter-spacing:.1em;color:var(--muted);pointer-events:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="load" id="load">LOADING</div>
  <header id="header">
    <div>
      <h1 id="veg">トマト</h1>
      <div class="sub" id="sub">TOMATO · TM01</div>
    </div>
    <div class="count" id="count">01 / 10</div>
  </header>
  <footer id="footer">
    <p id="desc"></p>
    <div class="dots" id="dots" role="tablist" aria-label="キャラクター"></div>
  </footer>
  <button class="flip" id="flip" aria-label="裏返す">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 11a8 8 0 0 0-14.3-4.9"/><path d="M5.5 2.5v4h4"/>
      <path d="M4 13a8 8 0 0 0 14.3 4.9"/><path d="M18.5 21.5v-4h-4"/>
    </svg>
  </button>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

const CHARS = window.CHARS || await (await fetch("characters.json")).json();
const EMBED = window.EMBED || null;
const $ = id => document.getElementById(id);
const N = CHARS.length;
CHARS.forEach(c => { const [num, en] = c.id.split(" / ")[0].split("."); c.num = num; c.en = en; c.code = c.id.split(" / ")[1]; });

/* ---------- renderer ---------- */
const app = $("app");
const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 0.6));
const FOV = 30, TAN = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.005, 5);

/* ---------- models ---------- */
const rigs = new Array(N).fill(null), pending = {};
const slots = CHARS.map(() => new THREE.Group());
function load(i){
  if (i < 0 || i >= N || rigs[i] || pending[i]) return pending[i];
  const k = CHARS[i].slug;
  const fromB64 = t => Uint8Array.from(atob(t.trim()), ch => ch.charCodeAt(0)).buffer;
  // models ship as base64 text (b64/<slug>.txt) because artifacts don't serve .glb
  const src = EMBED ? Promise.resolve(fromB64(EMBED[k])) : fetch(`b64/${k}.txt`).then(r => r.ok ? r : fetch(`${k}.txt`)).then(r => r.text()).then(fromB64);   // b64/ folder, or flat next to the page
  return pending[i] = src.then(buf => new Promise((res, rej) => new GLTFLoader().parse(buf, "", res, rej))).then(g => {
    g.scene.traverse(o => {
      if (!o.isMesh) return;
      if (/print/.test(o.material.name)) o.material = new THREE.MeshBasicMaterial({map: o.material.map, toneMapped: false});
      if (o.material.transparent){ o.material.depthWrite = false; o.material.envMapIntensity = 0.5; o.renderOrder = 2; }
    });
    const root = g.scene.getObjectByName("Yasai_Keychain");
    const segs = [];
    root.traverse(o => { if (o.name.startsWith("seg_")) segs.push(o); });
    segs.sort((a, b) => depth(a) - depth(b));
    slots[i].add(g.scene);
    rigs[i] = new Rig(segs, root.userData.pivots_mm.map(v => v / 1000), (Math.random() - .5) * 0.12);
    if (i === cur) $("load").hidden = true;
  });
}
function depth(o){ let d = 0; while (o.parent){ d++; o = o.parent; } return d; }

/* ---------- physics: a chain of rigid parts hanging from the clasp (position-based dynamics) ---------- */
const H = 1 / 240, DOWN = new THREE.Vector3(0, -1, 0), YAX = new THREE.Vector3(0, 1, 0);
const _qT = new THREE.Quaternion(), _qW = new THREE.Quaternion(), _qP = new THREE.Quaternion(), _d = new THREE.Vector3();
class Rig {
  constructor(segs, pivots, kick){
    this.segs = segs;
    this.P = pivots.map(y => new THREE.Vector3(0, y, 0));
    this.Q = pivots.map(y => new THREE.Vector3(0, y, 0));
    const n = this.P.length;
    this.w = this.P.map((_, i) => i === 0 ? 0 : i >= n - 2 ? 0.08 : i === 1 ? 0.5 : 1);
    this.rest = pivots.slice(1).map((y, i) => pivots[i] - y);
    this.twist = 0; this.omega = 0; this.target = 0;
    this.push(kick, 0, 0);
  }
  push(vx, vy, vz){ const n = this.P.length; for (const i of [n - 2, n - 1]){ this.Q[i].x -= vx * H; this.Q[i].y -= vy * H; this.Q[i].z -= vz * H; } }
  step(g){
    const {P, Q, w, rest} = this, n = P.length, damp = Math.exp(-2.2 * H);
    for (let i = 1; i < n; i++){
      const p = P[i], q = Q[i];
      const vx = (p.x - q.x) * damp, vy = (p.y - q.y) * damp, vz = (p.z - q.z) * damp;
      q.copy(p); p.x += vx + g.x * H * H; p.y += vy + g.y * H * H; p.z += vz + g.z * H * H;
    }
    for (let it = 0; it < 6; it++) for (let i = 0; i < n - 1; i++){
      const a = P[i], b = P[i + 1], wa = w[i], wb = w[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const len = Math.hypot(dx, dy, dz) || 1e-9, k = (len - rest[i]) / len / (wa + wb);
      a.x += wa * k * dx; a.y += wa * k * dy; a.z += wa * k * dz;
      b.x -= wb * k * dx; b.y -= wb * k * dy; b.z -= wb * k * dz;
    }
    for (let i = 1; i < n; i++) P[i].z = THREE.MathUtils.clamp(P[i].z, -0.06, 0.06);
  }
  spin(dt){
    this.omega += (28 * (this.target - this.twist) - 6 * this.omega) * dt;
    this.twist += this.omega * dt;
  }
  pose(){
    _qT.setFromAxisAngle(YAX, this.twist); _qP.identity();
    this.segs.forEach((s, i) => {
      _d.subVectors(this.P[i + 1], this.P[i]).normalize();
      _qW.setFromUnitVectors(DOWN, _d).multiply(_qT);
      s.quaternion.copy(_qP).invert().multiply(_qW);
      _qP.copy(_qW);
    });
  }
  get center(){ return this.P[this.P.length - 1]; }
}

/* ---------- swiper state ---------- */
let pos = 0, posVel = 0, prevPosVel = 0, target = 0, cur = -1;
let spacing = 0.07, baseDist = 0.4, zoom = 1, zoomTarget = 1, zoomMin = 0.3;
const dots = $("dots");
CHARS.forEach((c, i) => {
  const d = document.createElement("button");
  d.setAttribute("role", "tab"); d.setAttribute("aria-label", c.label);
  d.onclick = () => { target = i; };
  dots.appendChild(d);
});
function show(i){
  if (i === cur) return;
  cur = i;
  const c = CHARS[i];
  $("veg").textContent = c.label;
  $("sub").textContent = `${c.en} · ${c.code}`;
  $("count").textContent = `${String(i + 1).padStart(2, "0")} / ${N}`;
  $("desc").textContent = c.desc;
  $("flip").style.setProperty("--tint", c.color);
  [...dots.children].forEach((d, j) => d.setAttribute("aria-current", j === i));
  $("load").hidden = !!rigs[i];
  for (let j = i - 2; j <= i + 2; j++) load(j);
}
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") target = Math.min(target + 1, N - 1);
  if (e.key === "ArrowLeft") target = Math.max(target - 1, 0);
});

/* ---------- touch: swipe to change, tap to zoom in/out, pinch to zoom; the button flips ---------- */
const canvas = renderer.domElement, pts = new Map();
let drag = null, pinch0 = 0, zoom0 = 1, asked = false;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = zoom; drag = null; return; }
  drag = {x0: e.clientX, y0: e.clientY, x: e.clientX, t: performance.now(), t0: performance.now(), v: 0, pos0: pos};
});
canvas.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pts.size === 2){
    const [a, b] = [...pts.values()];
    zoom = zoomTarget = THREE.MathUtils.clamp(zoom0 * pinch0 / Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1), zoomMin, 1);
    return;
  }
  if (!drag) return;
  const now = performance.now(), dt = Math.max((now - drag.t) / 1000, 1 / 240);
  const pxPerSlide = spacing / (2 * baseDist * zoom * TAN) * canvas.clientHeight;
  const dx = e.clientX - drag.x;
  drag.v = 0.7 * drag.v + 0.3 * (-dx / pxPerSlide / dt);
  pos = THREE.MathUtils.clamp(drag.pos0 - (e.clientX - drag.x0) / pxPerSlide, -0.35, N - 0.65);
  drag.x = e.clientX; drag.t = now;
});
function release(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (!drag) return;
  const now = performance.now(), moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  // iOS asks for motion access only from a gesture; ask once, quietly, on the first touch
  if (!asked && typeof DeviceMotionEvent?.requestPermission === "function"){ asked = true; DeviceMotionEvent.requestPermission().catch(() => {}); }
  if (moved < 10 && now - drag.t0 < 300){
    zoomTarget = zoomTarget < (1 + zoomMin) / 2 ? 1 : zoomMin;   // tap: card fills the screen, tap again: back
  } else {
    posVel = drag.v;
    target = THREE.MathUtils.clamp(Math.round(pos + THREE.MathUtils.clamp(drag.v * 0.12, -1, 1)), 0, N - 1);
  }
  drag = null;
}
canvas.addEventListener("pointerup", release);
$("flip").onclick = () => { const r = rigs[cur]; if (r) r.target = Math.round(r.target / Math.PI) * Math.PI + Math.PI; };
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("wheel", e => { e.preventDefault(); zoom = zoomTarget = THREE.MathUtils.clamp(zoom * Math.exp(e.deltaY * 0.001), zoomMin, 1); }, {passive: false});

/* ---------- tilt & shake: the phone's own gravity and motion, where the browser shares it ---------- */
const grav = new THREE.Vector3(0, -9.8, 0);
let sign = 0;
addEventListener("devicemotion", e => {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  if (!sign){   // spec: reading points "up" at rest; some browsers flip it — calibrate once
    if (Math.hypot(a.x, a.y, a.z) < 5) return;
    const dom = Math.abs(a.y) > Math.abs(a.z) ? a.y : a.z;
    sign = dom > 0 ? -1 : 1;
  }
  const ang = (screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI / 180, c = Math.cos(ang), s = Math.sin(ang);
  grav.set(sign * (a.x * c + a.y * s), sign * (-a.x * s + a.y * c), sign * a.z);
  if (grav.length() > 30) grav.setLength(30);
});

/* ---------- layout: fit the whole keychain between the header and footer, card at screen centre ---------- */
let camY0 = 0;
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  // the card (tab top +47.8 mm to bottom -41 mm) plus the flip button fit between the title and the
  // description; the clasp may rise beside the title, never over text
  const CT = 0.0478, CB = 0.041, BTN = 56 + 12;
  const regTop = $("header").offsetHeight + 10, regBot = $("footer").offsetTop - 10, regH = regBot - regTop;
  const pxPerM = Math.min((regH - BTN) / (CT + CB), 0.70 * w / 0.06);   // card ≈ 70% of the screen width
  const blockTop = regTop + (regH - (CT + CB) * pxPerM - BTN) / 2;
  const cardZero = blockTop + CT * pxPerM;   // screen y of the card's centre
  const halfH = h / 2 / pxPerM;
  camY0 = (cardZero - h / 2) / pxPerM;
  baseDist = halfH / TAN;
  const halfW = halfH * camera.aspect, peek = Math.max(0.006, 0.2 * halfW);
  spacing = Math.min(halfW - peek + 0.03 * 0.82, 0.085);
  zoomMin = Math.min(1, 0.0306 / halfW);   // closest zoom: the card spans the full width
  zoom = THREE.MathUtils.clamp(zoom, zoomMin, 1); zoomTarget = THREE.MathUtils.clamp(zoomTarget, zoomMin, 1);
  $("flip").style.top = (blockTop + (CT + CB) * pxPerM + 12).toFixed(1) + "px";
}
new ResizeObserver(resize).observe(app);
resize();

/* ---------- loop ---------- */
let acc = 0, prevT = performance.now();
const g2 = new THREE.Vector3();
show(0);
renderer.setAnimationLoop(t => {
  const dt = Math.min((t - prevT) / 1000, 0.05); prevT = t;
  if (!drag){
    posVel += (90 * (target - pos) - 19 * posVel) * dt;
    pos += posVel * dt;
  }
  // the swiper's own acceleration nudges the keychains, like carrying them sideways
  const posAcc = THREE.MathUtils.clamp((posVel - prevPosVel) / Math.max(dt, 1e-3), -40, 40); prevPosVel = posVel;
  g2.copy(grav); g2.x += spacing * posAcc * 0.5;
  show(THREE.MathUtils.clamp(Math.round(pos), 0, N - 1));

  acc += dt;
  const steps = Math.floor(acc / H); acc -= steps * H;
  slots.forEach((slot, i) => {
    const off = i - pos, vis = Math.abs(off) < 2.2;
    if (vis && !slot.parent) scene.add(slot);
    if (!vis && slot.parent) scene.remove(slot);
    if (!vis) return;
    const s = 1 - 0.18 * Math.min(Math.abs(off), 1);
    slot.position.set(off * spacing, 0, 0); slot.scale.setScalar(s);
    const r = rigs[i]; if (!r) return;
    for (let k = 0; k < steps; k++) r.step(g2);
    r.spin(dt); r.pose();
  });

  if (pts.size < 2) zoom += (zoomTarget - zoom) * (1 - Math.exp(-9 * dt));
  // zooming in follows the centred card so its print stays readable
  const r = rigs[cur], f = zoomMin < 1 ? (1 - zoom) / (1 - zoomMin) : 0;
  const ui = String(THREE.MathUtils.clamp(1 - f * 2.5, 0, 1));   // overlay text steps aside while zoomed
  if ($("header").style.opacity !== ui){ $("header").style.opacity = ui; $("footer").style.opacity = ui; }
  const tx = f * ((cur - pos) * spacing + (r ? r.center.x : 0)), ty = camY0 * (1 - f) + (r ? r.center.y * f : 0);
  camera.position.set(tx, ty, baseDist * zoom); camera.lookAt(tx, ty, 0);
  renderer.render(scene, camera);
});
</script>

</body>
</html>
